name: Build Camera Noise Fixer APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Extract project
        run: |
          unzip -q CameraNoiseFixerGM24.zip -d extracted

      - name: Build APK
        working-directory: extracted/CameraNoiseFixerGM24
        run: gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: CameraNoiseFixer-GM24-debug-apk
          path: extracted/CameraNoiseFixerGM24/app/build/outputs/apk/debug/app-debug.apk
